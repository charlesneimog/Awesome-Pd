[project]
site_name = "PureData Ecosystem"
site_url = "https://charlesneimog.github.io/Awesome-Pd/"
docs_dir = "docs"
repo_url = "https://github.com/charlesneimog/Awesome-Pd"
extra_javascript = [
    "js/objects.js",
]
extra_css = [
    "stylesheets/extra.css",
]
not_in_nav = """
/todo.md
/prompts/helppatchai.md
"""

[project.extra]
head = [
    "<link rel=\"preload\" href=\"../submit-external/index.html\" as=\"document\">",
]

[project.theme]
logo = "assets/icon.svg"
language = "en"
variant = "modern"
features = [
    "navigation.indexes",
    "navigation.instant",
    "navigation.tabs",
    "navigation.path",
    "search.highlight",
    "search.share",
    "search.suggest",
    "toc.integrate",
    "header.autohide",
    "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"

[project.theme.palette.toggle]
icon = "material/brightness-auto"
name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "light blue"

[project.theme.palette.toggle]
icon = "material/lightbulb"
name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
accent = "light blue"
primary = "black"

[project.theme.palette.toggle]
icon = "material/lightbulb-outline"
name = "Switch to light mode"

[project.theme.icon]
annotation = "material/plus-circle"

[[project.nav]]
Home = "index.md"

